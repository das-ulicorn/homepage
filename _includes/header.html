<header class="site-header" role="banner">

  <div class="wrapper">
    <h1><a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a></h1>
    <ul class="socials">
      {%- for social in site.socials -%}
      <li><a title="{{ social.name }}"
	     href="https://{{ social.site }}{{ social.path }}"
	     ><img class="favicon"
		   alt="{{social.name}}"
		   src="https://icons.duckduckgo.com/ip3/{{social.site}}.ico"
		   /></a></li>
      {%- endfor -%}
    </ul>
  </div>
</header>
